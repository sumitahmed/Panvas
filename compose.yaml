services:
  web:
    image: panvas-web:local
    build:
      context: .
      target: production
      args:
        VITE_ENABLE_CLOUD_SYNC: ${VITE_ENABLE_CLOUD_SYNC:-false}
        VITE_PANVAS_SYNC_V2: ${VITE_PANVAS_SYNC_V2:-false}
        VITE_PANVAS_GOOGLE_WEB_CLIENT_ID: ${VITE_PANVAS_GOOGLE_WEB_CLIENT_ID:-}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_PANVAS_BUILD_ID: ${VITE_PANVAS_BUILD_ID:-local}
    ports:
      - "${PANVAS_BIND_ADDRESS:-127.0.0.1}:${PANVAS_WEB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    mem_limit: 256m
    cpus: 1.0
    networks: [frontend]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  frontend:
