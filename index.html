<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://*.supabase.co https://*.posthog.com https://huggingface.co https://*.huggingface.co https://*.hf.co https://cas-bridge.xethub.hf.co https://www.googleapis.com https://*.googleapis.com https://oauth2.googleapis.com https://openidconnect.googleapis.com https://accounts.google.com https://libraries.excalidraw.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-src https://accounts.google.com/gsi/; form-action 'self'" />
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      /* Pre-React bootstrap fallback in Panvas's paper language: warm neutral
         light by default, ink dark via the OS preference (reading the
         persisted theme would require an inline script, which CSP blocks). */
      .panvas-bootstrap-fallback, .panvas-bootstrap-failure {
        min-height: 100vh; display: grid; place-content: center; justify-items: center;
        gap: 12px; box-sizing: border-box; padding: 32px; text-align: center;
        color: #33302a; background: #f7f4ec; font-family: Inter, system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        .panvas-bootstrap-fallback, .panvas-bootstrap-failure {
          color: #d8d3c8; background: #1a1815;
        }
      }
      .panvas-bootstrap-logo {
        width: 64px; height: 64px; border-radius: 16px; display: block;
        box-shadow: 0 8px 22px rgb(30 27 22 / 0.14), 0 1px 2px rgb(30 27 22 / 0.10);
      }
      .panvas-bootstrap-fallback h1, .panvas-bootstrap-failure h1,
      .panvas-bootstrap-fallback p, .panvas-bootstrap-failure p { margin: 0; }
      .panvas-bootstrap-wordmark { font-size: 0.95rem; font-weight: 600; letter-spacing: -0.01em; }
      .panvas-bootstrap-bar {
        width: 96px; height: 3px; border-radius: 999px; overflow: hidden;
        background: rgb(51 48 42 / 0.14);
      }
      @media (prefers-color-scheme: dark) {
        .panvas-bootstrap-bar { background: rgb(216 211 200 / 0.16); }
      }
      .panvas-bootstrap-bar span {
        display: block; width: 40%; height: 100%; border-radius: 999px;
        background: rgb(51 48 42 / 0.55);
        animation: panvas-bootstrap-slide 1.4s ease-in-out infinite;
      }
      @media (prefers-color-scheme: dark) {
        .panvas-bootstrap-bar span { background: rgb(216 211 200 / 0.6); }
      }
      @keyframes panvas-bootstrap-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(280%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .panvas-bootstrap-bar span { animation: none; transform: translateX(0); opacity: 0.5; }
      }
      .panvas-bootstrap-failure button {
        justify-self: center; margin-top: 8px; padding: 10px 16px; border: 1px solid #505967;
        border-radius: 8px; color: #0d1117; background: #e8e8e8; cursor: pointer;
      }
    </style>
    <script src="/excalidraw-config.js"></script>
    <meta charset="UTF-8" />
    <link rel="preload" as="image" href="/panvas_logo.png" />
    <link rel="icon" type="image/png" href="/panvas_logo.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Panvas — A visual thinking workspace for engineers, researchers, and technical students. Think. Sketch. Write. Build." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Panvas — Visual Research Workspace" />
    <meta property="og:description" content="Think. Sketch. Write. Build. The infinite canvas for engineers, researchers and creators." />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Panvas — Visual Research Workspace" />
    <meta property="twitter:description" content="Think. Sketch. Write. Build. The infinite canvas for engineers, researchers and creators." />
    <meta property="twitter:image" content="/og-image.png" />

    <title>Panvas — Visual Research Workspace</title>
  </head>
  <body class="bg-[#0D1117] text-white antialiased">
    <div id="root">
      <main class="panvas-bootstrap-fallback" role="status" aria-live="polite">
        <img src="/panvas_logo.png" alt="" class="panvas-bootstrap-logo" width="64" height="64" />
        <p class="panvas-bootstrap-wordmark">Panvas</p>
        <div class="panvas-bootstrap-bar" aria-hidden="true"><span></span></div>
        <noscript>Panvas requires JavaScript. Your local data has not been changed.</noscript>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
