worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  sendfile on;
  keepalive_timeout 30;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  gzip on;
  gzip_types text/css text/javascript application/javascript application/json application/wasm image/svg+xml;
  map $uri $cache_control {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    /service-worker.js "no-store";
  }
  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://*.supabase.co https://*.posthog.com https://huggingface.co https://*.huggingface.co https://*.hf.co https://cas-bridge.xethub.hf.co https://www.googleapis.com https://*.googleapis.com https://oauth2.googleapis.com https://openidconnect.googleapis.com https://accounts.google.com https://libraries.excalidraw.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-src https://accounts.google.com/gsi/; frame-ancestors 'none'; form-action 'self'" always;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location / { try_files $uri $uri/ /index.html; }
    # Missing hashed/static assets must be 404s, never an HTML SPA fallback.
    location ~* \.(?:js|mjs|css|wasm|map|json|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|mp4|webm|pdf)$ {
      try_files $uri =404;
    }
    location ~ /\. { deny all; }
  }
}
